<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisper Audio Transcription</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Whisper Audio Transcription</h1>

        <!-- Audio File Selection -->
        <div class="input-group">
            <label for="audio-file">Audio File:</label>
            <input type="text" id="audio-file" placeholder="Select an audio file" readonly>
            <button id="browse-button">Browse</button>
        </div>

        <!-- Transcription Button -->
        <button id="transcribe-button">Transcribe</button>

        <!-- Transcription Area -->
        <label for="transcription">Transcription:</label>
        <textarea id="transcription" readonly></textarea>

        <!-- Status Log Area -->
        <label for="status-log">Status:</label>
        <textarea id="status-log" readonly></textarea>
    </div>

    <script src="script.js"></script>
</body>
</html>
